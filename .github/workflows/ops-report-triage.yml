name: Ops Report Triage

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ops-report-triage
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'storyline-cbd6a' }}
      TRIAGED_BY: github-actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_OPS_SERVICE_ACCOUNT_JSON }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      - name: Triage open app reports
        run: |
          FIRESTORE_ACCESS_TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::${FIRESTORE_ACCESS_TOKEN}"
          export FIRESTORE_ACCESS_TOKEN
          export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          node scripts/triage-ops-reports.mjs

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Ops Report Triage"
            echo ""
            echo "- Project: \`${FIREBASE_PROJECT_ID}\`"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
            echo "- Actor: \`${GITHUB_ACTOR}\`"
          } >> "$GITHUB_STEP_SUMMARY"
