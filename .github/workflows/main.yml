name: Android CI Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Restore google-services.json
        working-directory: android
        run: |
          if [ -n "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}" ]; then
            printf '%s' '${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}' > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"394439942843","project_id":"storyline-video-editor","storage_bucket":"storyline-video-editor.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:394439942843:android:bf3aa9f3e5dc1184f83f9e","android_client_info":{"package_name":"com.storyline.videoeditor"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyBue3Tfx9rE970EnVIjTbQVok6i6GnCjZ0"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Restore stable debug keystore
        run: |
          if [ -n "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" ]; then
            printf '%s' '${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}' | base64 --decode > "${GITHUB_WORKSPACE}/android/debug.keystore.stable"
          elif [ ! -f "${GITHUB_WORKSPACE}/android/debug.keystore.stable" ]; then
            keytool -genkey -v -keystore "${GITHUB_WORKSPACE}/android/debug.keystore.stable" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}" ]; then
            printf '%s' '${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}' | base64 --decode > "${GITHUB_WORKSPACE}/android/release.keystore"
          fi

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/android/debug.keystore.stable
          ANDROID_DEBUG_KEYSTORE_PASSWORD: android
          ANDROID_DEBUG_KEY_ALIAS: androiddebugkey
          ANDROID_DEBUG_KEY_PASSWORD: android
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ vars.ADMOB_BANNER_UNIT_ID }}
          ADMOB_REWARDED_HD_UNLOCK_UNIT_ID: ${{ vars.ADMOB_REWARDED_HD_UNLOCK_UNIT_ID }}
          ADMOB_INTERSTITIAL_POST_EXPORT_UNIT_ID: ${{ vars.ADMOB_INTERSTITIAL_POST_EXPORT_UNIT_ID }}
        run: ./gradlew assemblePlayDebug

      - name: Build Play release APK
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ vars.ADMOB_BANNER_UNIT_ID }}
          ADMOB_REWARDED_HD_UNLOCK_UNIT_ID: ${{ vars.ADMOB_REWARDED_HD_UNLOCK_UNIT_ID }}
          ADMOB_INTERSTITIAL_POST_EXPORT_UNIT_ID: ${{ vars.ADMOB_INTERSTITIAL_POST_EXPORT_UNIT_ID }}
        run: ./gradlew assemblePlayRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: storyline-debug-apk
          path: android/app/build/outputs/apk/play/debug/*.apk

      - name: Upload Play release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: storyline-play-release-apk
          path: android/app/build/outputs/apk/play/release/*.apk

      - name: Set up Node.js
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare APK website bundle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: .
        run: |
          release_apk="$(find android/app/build/outputs/apk/play/release -name '*.apk' | sort | head -n 1)"
          if [ -z "${release_apk}" ]; then
            echo "::error::Play release APK was not produced."
            exit 1
          fi
          cp "${release_apk}" apk-host/public/app.apk
          node <<'EOF'
          const fs = require("fs");
          const { execSync } = require("child_process");

          const gradle = fs.readFileSync("android/app/build.gradle", "utf8");
          const apkStats = fs.statSync("apk-host/public/app.apk");
          const versionName = (gradle.match(/versionName\s*=\s*"([^"]+)"/) || [])[1] || "unknown";
          const versionCode = Number((gradle.match(/versionCode\s*=\s*(\d+)/) || [])[1] || 0);
          const commitSubject = execSync("git log -1 --pretty=%s", { encoding: "utf8" }).trim();
          const commitAuthor = execSync("git log -1 --pretty=%an", { encoding: "utf8" }).trim();

          const metadata = {
            appName: "Storyline",
            apkName: "app.apk",
            versionName,
            versionCode,
            releaseLabel: `v${versionName} (${versionCode})`,
            buildNumber: process.env.GITHUB_RUN_NUMBER,
            branch: process.env.GITHUB_REF_NAME,
            channel: process.env.GITHUB_REF_NAME === "main" ? "production" : "preview",
            commitSha: process.env.GITHUB_SHA,
            shortSha: process.env.GITHUB_SHA.slice(0, 8),
            commitSubject,
            commitAuthor,
            apkSizeBytes: apkStats.size,
            builtAt: new Date().toISOString(),
            workflowUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            downloadPath: "/app.apk",
            adminPanelUrl: "",
            autoLive: true,
          };

          fs.writeFileSync("apk-host/public/build.json", JSON.stringify(metadata, null, 2));
          EOF

      - name: Install Vercel CLI
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: .
        run: npm install --global vercel@latest

      - name: Deploy APK website to Vercel
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: apk-host
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "::warning::Missing one or more Vercel deployment secrets. Skipping APK site deploy."
            exit 0
          fi
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"projectId":"${VERCEL_PROJECT_ID}","orgId":"${VERCEL_ORG_ID}","projectName":"apk-host"}
          EOF
          if ! vercel deploy --prod --yes --token "${VERCEL_TOKEN}"; then
            echo "::warning::Vercel deploy failed, but debug APK artifact was uploaded successfully."
          fi
