name: Android CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Node.js
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Restore google-services.json
        working-directory: android
        run: |
          if [ -z "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}" ]; then
            echo "Missing repository secret ANDROID_GOOGLE_SERVICES_JSON"
            echo "Add the full contents of android/app/google-services.json as a GitHub Actions secret."
            exit 1
          fi
          printf '%s' '${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Restore stable debug keystore
        run: |
          if [ -z "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" ]; then
            echo "::error::Missing ANDROID_DEBUG_KEYSTORE_B64 secret. Refusing to build a drift-signed debug APK."
            exit 1
          fi
          printf '%s' '${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}' | base64 --decode > "${GITHUB_WORKSPACE}/android/debug.keystore.stable"

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/android/debug.keystore.stable
          ANDROID_DEBUG_KEYSTORE_PASSWORD: android
          ANDROID_DEBUG_KEY_ALIAS: androiddebugkey
          ANDROID_DEBUG_KEY_PASSWORD: android
          AWS_CONTROL_PLANE_URL: ${{ vars.AWS_CONTROL_PLANE_URL }}
          AWS_CONTROL_PLANE_DEVICE_KEY: ${{ secrets.AWS_CONTROL_PLANE_DEVICE_KEY }}
          RELEASE_PORTAL_URL: ${{ vars.RELEASE_PORTAL_URL }}
          ADMIN_PANEL_URL: ${{ vars.ADMIN_PANEL_URL }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ vars.ADMOB_BANNER_UNIT_ID }}
          ADMOB_REWARDED_HD_UNLOCK_UNIT_ID: ${{ vars.ADMOB_REWARDED_HD_UNLOCK_UNIT_ID }}
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: storyline-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Prepare APK website bundle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: .
        env:
          ADMIN_PANEL_URL: ${{ vars.ADMIN_PANEL_URL }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-host/public/app.apk
          node <<'EOF'
          const fs = require("fs");
          const { execSync } = require("child_process");

          const gradle = fs.readFileSync("android/app/build.gradle", "utf8");
          const apkStats = fs.statSync("apk-host/public/app.apk");
          const versionName = (gradle.match(/versionName\s*=\s*"([^"]+)"/) || [])[1] || "unknown";
          const versionCode = Number((gradle.match(/versionCode\s*=\s*(\d+)/) || [])[1] || 0);
          const commitSubject = execSync("git log -1 --pretty=%s", { encoding: "utf8" }).trim();
          const commitAuthor = execSync("git log -1 --pretty=%an", { encoding: "utf8" }).trim();

          const metadata = {
            appName: "Storyline",
            apkName: "app.apk",
            versionName,
            versionCode,
            releaseLabel: `v${versionName} (${versionCode})`,
            buildNumber: process.env.GITHUB_RUN_NUMBER,
            branch: process.env.GITHUB_REF_NAME,
            channel: process.env.GITHUB_REF_NAME === "main" ? "production" : "preview",
            commitSha: process.env.GITHUB_SHA,
            shortSha: process.env.GITHUB_SHA.slice(0, 8),
            commitSubject,
            commitAuthor,
            apkSizeBytes: apkStats.size,
            builtAt: new Date().toISOString(),
            workflowUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            downloadPath: "/app.apk",
            adminPanelUrl: process.env.ADMIN_PANEL_URL || "",
            autoLive: true,
          };

          fs.writeFileSync("apk-host/public/build.json", JSON.stringify(metadata, null, 2));
          EOF

      - name: Install Vercel CLI
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: .
        run: npm install --global vercel@latest

      - name: Deploy APK website to Vercel
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: apk-host
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "::warning::Missing one or more Vercel deployment secrets. Skipping APK site deploy."
            exit 0
          fi
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"projectId":"${VERCEL_PROJECT_ID}","orgId":"${VERCEL_ORG_ID}","projectName":"apk-host"}
          EOF
          if ! vercel deploy --prod --yes --token "${VERCEL_TOKEN}"; then
            echo "::warning::Vercel deploy failed, but debug APK artifact was uploaded successfully."
          fi

      - name: Deploy admin panel to Vercel
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: admin-panel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_ADMIN_PROJECT_ID: ${{ vars.VERCEL_ADMIN_PROJECT_ID }}
        run: |
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_ADMIN_PROJECT_ID}" ]; then
            echo "::warning::Missing one or more admin panel Vercel settings. Skipping admin panel deploy."
            exit 0
          fi
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"projectId":"${VERCEL_ADMIN_PROJECT_ID}","orgId":"${VERCEL_ORG_ID}","projectName":"storyline"}
          EOF
          if ! vercel deploy --prod --yes --token "${VERCEL_TOKEN}"; then
            echo "::warning::Admin panel Vercel deploy failed."
          fi
