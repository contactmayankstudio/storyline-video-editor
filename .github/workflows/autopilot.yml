name: Storyline Continuous Autopilot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: storyline-continuous-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}

    steps:
      - name: Checkout repository
        env:
          CI_CHECKOUT_REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/checkout-ci.sh

      - name: Load autopilot config
        id: config
        run: |
          node <<'EOF'
          const fs = require("fs");
          const configPath = "automation/autopilot.config.json";
          const defaults = {
            enabled: false,
            prompt: "",
            targetBranch: "main",
            maxAttempts: 2,
            cadenceMinutes: 30,
          };
          const config = fs.existsSync(configPath)
            ? { ...defaults, ...JSON.parse(fs.readFileSync(configPath, "utf8")) }
            : defaults;
          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, `enabled=${config.enabled ? "true" : "false"}\n`);
          fs.appendFileSync(output, `target_branch=${config.targetBranch || "main"}\n`);
          fs.appendFileSync(output, `max_attempts=${String(config.maxAttempts || 2)}\n`);
          fs.appendFileSync(output, `prompt<<__PROMPT__\n${String(config.prompt || "").trim()}\n__PROMPT__\n`);
          EOF

      - name: Skip when autopilot is disabled
        if: steps.config.outputs.enabled != 'true'
        run: echo "Continuous autopilot is disabled."

      - name: Skip when prompt is empty
        if: steps.config.outputs.enabled == 'true' && steps.config.outputs.prompt == ''
        run: echo "::warning::Autopilot is enabled but prompt is empty. Nothing will be dispatched."

      - name: Check for active automation run
        if: steps.config.outputs.enabled == 'true' && steps.config.outputs.prompt != ''
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'automation.yml',
              branch: '${{ steps.config.outputs.target_branch }}',
              per_page: 5,
            });
            const active = (runs.data.workflow_runs || []).find((run) => ['queued', 'in_progress'].includes(run.status));
            core.setOutput('skip', active ? 'true' : 'false');
            if (active) {
              core.notice(`Skipping autopilot dispatch because automation run ${active.id} is still ${active.status}.`);
            }

      - name: Dispatch continuous automation worker
        if: steps.config.outputs.enabled == 'true' && steps.config.outputs.prompt != '' && steps.gate.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          AUTOPILOT_PROMPT: ${{ steps.config.outputs.prompt }}
          AUTOPILOT_TARGET_BRANCH: ${{ steps.config.outputs.target_branch }}
          AUTOPILOT_MAX_ATTEMPTS: ${{ steps.config.outputs.max_attempts }}
        with:
          script: |
            const prompt = `[Continuous AI autopilot]\n${process.env.AUTOPILOT_PROMPT || ''}`.trim();
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'automation.yml',
              ref: process.env.AUTOPILOT_TARGET_BRANCH || 'main',
              inputs: {
                prompt,
                target_branch: process.env.AUTOPILOT_TARGET_BRANCH || 'main',
                max_attempts: process.env.AUTOPILOT_MAX_ATTEMPTS || '2',
              },
            });
            core.notice('Continuous autopilot dispatched the automation worker.');
