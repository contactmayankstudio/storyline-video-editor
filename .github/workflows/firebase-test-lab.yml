name: Firebase Test Lab

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: "Firebase Test Lab device model"
        required: true
        default: "MediumPhone.arm"
        type: string
      android_version:
        description: "Android version to test"
        required: true
        default: "34"
        type: string
      locale:
        description: "Device locale"
        required: true
        default: "en"
        type: string
      orientation:
        description: "Device orientation"
        required: true
        default: "portrait"
        type: choice
        options:
          - portrait
          - landscape
      timeout:
        description: "Robo test timeout"
        required: true
        default: "5m"
        type: string

concurrency:
  group: firebase-test-lab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  robo-test:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_RESULTS_BUCKET: ${{ vars.FIREBASE_RESULTS_BUCKET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}

      - name: Restore google-services.json
        working-directory: android
        run: |
          if [ -z "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}" ]; then
            echo "Missing repository secret ANDROID_GOOGLE_SERVICES_JSON"
            exit 1
          fi
          printf '%s' '${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Restore stable debug keystore
        run: |
          if [ -z "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" ]; then
            echo "::warning::Missing ANDROID_DEBUG_KEYSTORE_B64 secret. Continuing with default debug signing."
            exit 0
          fi
          mkdir -p "${HOME}/.android"
          printf '%s' '${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}' | base64 --decode > "${HOME}/.android/debug.keystore"

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --console=plain

      - name: Run Robo test in Firebase Test Lab
        env:
          INPUT_DEVICE_MODEL: ${{ inputs.device_model }}
          INPUT_ANDROID_VERSION: ${{ inputs.android_version }}
          INPUT_LOCALE: ${{ inputs.locale }}
          INPUT_ORIENTATION: ${{ inputs.orientation }}
          INPUT_TIMEOUT: ${{ inputs.timeout }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_PROJECT_ID}" ]; then
            echo "Missing repository variable FIREBASE_PROJECT_ID"
            exit 1
          fi

          RESULTS_DIR="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          CMD=(
            gcloud firebase test android run
            --type robo
            --project "${FIREBASE_PROJECT_ID}"
            --app "${APK_PATH}"
            --device "model=${INPUT_DEVICE_MODEL},version=${INPUT_ANDROID_VERSION},locale=${INPUT_LOCALE},orientation=${INPUT_ORIENTATION}"
            --timeout "${INPUT_TIMEOUT}"
            --results-dir "${RESULTS_DIR}"
          )

          if [ -n "${FIREBASE_RESULTS_BUCKET}" ]; then
            CMD+=(--results-bucket "${FIREBASE_RESULTS_BUCKET}")
          fi

          printf 'Running: %s\n' "${CMD[*]}"
          "${CMD[@]}" | tee firebase-test-lab.log

          {
            echo "## Firebase Test Lab"
            echo ""
            echo "- Project: \`${FIREBASE_PROJECT_ID}\`"
            echo "- Device: \`${INPUT_DEVICE_MODEL}\`"
            echo "- Android: \`${INPUT_ANDROID_VERSION}\`"
            echo "- Locale: \`${INPUT_LOCALE}\`"
            echo "- Orientation: \`${INPUT_ORIENTATION}\`"
            echo "- Timeout: \`${INPUT_TIMEOUT}\`"
            echo "- Results dir: \`${RESULTS_DIR}\`"
            if [ -n "${FIREBASE_RESULTS_BUCKET}" ]; then
              echo "- Results bucket: \`${FIREBASE_RESULTS_BUCKET}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Firebase Test Lab log
        uses: actions/upload-artifact@v4
        with:
          name: firebase-test-lab-log
          path: firebase-test-lab.log
