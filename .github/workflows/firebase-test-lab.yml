name: Firebase Test Lab

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: "Firebase Test Lab device model"
        required: true
        default: "MediumPhone.arm"
        type: string
      android_version:
        description: "Android version to test"
        required: true
        default: "34"
        type: string
      locale:
        description: "Device locale"
        required: true
        default: "en"
        type: string
      orientation:
        description: "Device orientation"
        required: true
        default: "portrait"
        type: choice
        options:
          - portrait
          - landscape
      timeout:
        description: "Robo test timeout"
        required: true
        default: "5m"
        type: string

concurrency:
  group: firebase-test-lab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  robo-test:
    runs-on: ubuntu-latest
    env:
      FIREBASE_TEST_LAB_PROJECT_ID: ${{ vars.FIREBASE_TEST_LAB_PROJECT_ID || vars.FIREBASE_PROJECT_ID }}
      FIREBASE_TEST_LAB_RESULTS_BUCKET: ${{ vars.FIREBASE_TEST_LAB_RESULTS_BUCKET || vars.FIREBASE_RESULTS_BUCKET }}
      FIREBASE_TEST_LAB_CREDENTIALS_JSON: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_OPS_SERVICE_ACCOUNT_JSON }}
      ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Firebase Test Lab configuration
        id: preflight
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${FIREBASE_TEST_LAB_PROJECT_ID}" ]; then
            echo "::warning::Missing FIREBASE_TEST_LAB_PROJECT_ID or FIREBASE_PROJECT_ID repository variable."
            missing=1
          fi
          if [ -z "${FIREBASE_TEST_LAB_CREDENTIALS_JSON}" ]; then
            echo "::warning::Missing Firebase Test Lab service account secret. Expected FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON or FIREBASE_OPS_SERVICE_ACCOUNT_JSON."
            missing=1
          fi
          if [ -z "${ANDROID_GOOGLE_SERVICES_JSON}" ]; then
            echo "::warning::Missing ANDROID_GOOGLE_SERVICES_JSON repository secret."
            missing=1
          fi
          if [ "${missing}" -eq 0 ]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up JDK 17
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Authenticate to Google Cloud
        if: steps.preflight.outputs.ready == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.FIREBASE_TEST_LAB_CREDENTIALS_JSON }}

      - name: Set up gcloud
        if: steps.preflight.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.FIREBASE_TEST_LAB_PROJECT_ID }}

      - name: Ensure Firebase Test Lab APIs
        if: steps.preflight.outputs.ready == 'true'
        id: service_apis
        run: |
          set -euo pipefail
          ready=true
          for service in firebase.googleapis.com testing.googleapis.com toolresults.googleapis.com; do
            if gcloud services list \
              --enabled \
              --project "${FIREBASE_TEST_LAB_PROJECT_ID}" \
              --format="value(config.name)" | grep -Fxq "${service}"; then
              echo "Service ${service} already enabled."
              continue
            fi

            echo "Enabling ${service}..."
            if ! gcloud services enable "${service}" --project "${FIREBASE_TEST_LAB_PROJECT_ID}"; then
              echo "::warning::Unable to enable ${service}. Skipping Firebase Test Lab run for this project."
              ready=false
              break
            fi
          done
          echo "ready=${ready}" >> "${GITHUB_OUTPUT}"

      - name: Detect Firebase Test Lab device model
        if: steps.preflight.outputs.ready == 'true' && steps.service_apis.outputs.ready == 'true'
        id: device_model
        env:
          INPUT_DEVICE_MODEL: ${{ inputs.device_model }}
        run: |
          set -euo pipefail
          gcloud firebase test android models list \
            --format="value(id)" \
            | sort -u > firebase-test-lab-models.txt

          requested="${INPUT_DEVICE_MODEL}"
          resolved=""
          if grep -Fxq "${requested}" firebase-test-lab-models.txt; then
            resolved="${requested}"
          elif grep -Fxq "MediumPhone.arm" firebase-test-lab-models.txt; then
            resolved="MediumPhone.arm"
            echo "::warning::Requested device model ${requested} is unavailable. Falling back to ${resolved}."
          else
            resolved="$(head -n 1 firebase-test-lab-models.txt)"
            echo "::warning::Requested device model ${requested} is unavailable. Falling back to ${resolved}."
          fi

          echo "resolved=${resolved}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Firebase Test Lab Device Detection"
            echo ""
            echo "- Requested model: \`${requested}\`"
            echo "- Resolved model: \`${resolved}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Restore google-services.json
        if: steps.preflight.outputs.ready == 'true' && steps.service_apis.outputs.ready == 'true'
        working-directory: android
        run: |
          printf '%s' "${ANDROID_GOOGLE_SERVICES_JSON}" > app/google-services.json

      - name: Restore stable debug keystore
        if: steps.preflight.outputs.ready == 'true' && steps.service_apis.outputs.ready == 'true'
        run: |
          if [ -z "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" ]; then
            echo "::warning::Missing ANDROID_DEBUG_KEYSTORE_B64 secret. Continuing with default debug signing."
            exit 0
          fi
          mkdir -p "${HOME}/.android"
          printf '%s' '${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}' | base64 --decode > "${HOME}/.android/debug.keystore"

      - name: Make Gradle wrapper executable
        if: steps.preflight.outputs.ready == 'true' && steps.service_apis.outputs.ready == 'true'
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        if: steps.preflight.outputs.ready == 'true' && steps.service_apis.outputs.ready == 'true'
        working-directory: android
        run: ./gradlew assembleDebug --console=plain

      - name: Run Robo test in Firebase Test Lab
        if: steps.preflight.outputs.ready == 'true' && steps.service_apis.outputs.ready == 'true'
        env:
          RESOLVED_DEVICE_MODEL: ${{ steps.device_model.outputs.resolved }}
          INPUT_ANDROID_VERSION: ${{ inputs.android_version }}
          INPUT_LOCALE: ${{ inputs.locale }}
          INPUT_ORIENTATION: ${{ inputs.orientation }}
          INPUT_TIMEOUT: ${{ inputs.timeout }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_TEST_LAB_PROJECT_ID}" ]; then
            echo "Missing repository variable FIREBASE_TEST_LAB_PROJECT_ID"
            exit 1
          fi

          RESULTS_DIR="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          CMD=(
            gcloud firebase test android run
            --type robo
            --project "${FIREBASE_TEST_LAB_PROJECT_ID}"
            --app "${APK_PATH}"
            --device "model=${RESOLVED_DEVICE_MODEL},version=${INPUT_ANDROID_VERSION},locale=${INPUT_LOCALE},orientation=${INPUT_ORIENTATION}"
            --timeout "${INPUT_TIMEOUT}"
            --results-dir "${RESULTS_DIR}"
          )

          if [ -n "${FIREBASE_TEST_LAB_RESULTS_BUCKET}" ]; then
            CMD+=(--results-bucket "${FIREBASE_TEST_LAB_RESULTS_BUCKET}")
          fi

          printf 'Running: %s\n' "${CMD[*]}"
          "${CMD[@]}" | tee firebase-test-lab.log

          {
            echo "## Firebase Test Lab"
            echo ""
            echo "- Project: \`${FIREBASE_TEST_LAB_PROJECT_ID}\`"
            echo "- Device: \`${RESOLVED_DEVICE_MODEL}\`"
            echo "- Android: \`${INPUT_ANDROID_VERSION}\`"
            echo "- Locale: \`${INPUT_LOCALE}\`"
            echo "- Orientation: \`${INPUT_ORIENTATION}\`"
            echo "- Timeout: \`${INPUT_TIMEOUT}\`"
            echo "- Results dir: \`${RESULTS_DIR}\`"
            if [ -n "${FIREBASE_TEST_LAB_RESULTS_BUCKET}" ]; then
              echo "- Results bucket: \`${FIREBASE_TEST_LAB_RESULTS_BUCKET}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Firebase Test Lab log
        if: steps.preflight.outputs.ready == 'true' && steps.service_apis.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: firebase-test-lab-log
          path: firebase-test-lab.log

      - name: Upload Firebase Test Lab device catalog
        if: steps.preflight.outputs.ready == 'true' && steps.service_apis.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: firebase-test-lab-models
          path: firebase-test-lab-models.txt

      - name: Skip summary when Firebase Test Lab is not configured
        if: steps.preflight.outputs.ready != 'true' || steps.service_apis.outputs.ready != 'true'
        run: |
          {
            echo "## Firebase Test Lab"
            echo ""
            echo "Skipped because project variables, service account credentials, or required Google APIs are unavailable."
          } >> "${GITHUB_STEP_SUMMARY}"
