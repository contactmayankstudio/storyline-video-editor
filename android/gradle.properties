# Android X support
android.useAndroidX=true
android.enableJetifier=true

# Gradle (Memory optimized for 4GB RAM)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.vfs.watch=true
org.gradle.workers.max=1

# Kotlin
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvmargs=-Xmx1024m
kotlin.daemon.enabled=false
kotlin.compiler.execution.strategy=in-process

# Android build performance
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Java home is resolved via JAVA_HOME environment variable

# Suppress compileSdk warning
android.suppressUnsupportedCompileSdk=35,36

